schema_version: 6

project:
  repo: rasokiwayami/study-app
  type: portfolio_product_candidate
  domain: study_tracking
  primary_goal: Local study tracking app with Flask and Tkinter surfaces
  default_branch: main
  visibility: private_or_public_per_current_remote
  authority:
    # These are target-local filters; central authority and task evidence still decide execution.
    allowed_actions:
      - dev.local_inspect
      - dev.local_edit
      - dev.local_test
      - dev.local_commit
    forbidden_actions:
      - dev.repo_create_visibility_deploy_or_publish
      - dev.secret_or_security_mutation
      - dev.production_data_mutation
      - auth.secret_read_or_print
      - finance.spending_or_paid_service_change
      - dev.destructive_action

runtime:
  local_only: true
  deployment: render_configured_but_not_default_action
  languages:
    - python
  package_managers:
    - pip
  operating_environment:
    - Mac local operation under /Users/sora/dev/study-app
    - Legacy Windows/WSL operation remains a normal Python context

verification:
  default:
    - python3 -m py_compile app.py study_app.py
  formatting:
    - git diff --check

state:
  ignored_runtime_dirs:
    - __pycache__/
    - .pytest_cache/
    - output/
  local_private_files:
    - study_records.db
  canonical_progress:
    - AGENTS.md
    - PROJECT_PROFILE.yaml
    - app.py
    - study_app.py
    - templates/
